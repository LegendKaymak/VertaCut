name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(grep -oP "vertacut-v\K[0-9.]+" sw.js)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: git archive --format=zip --prefix=VertaCut-${{ steps.v.outputs.version }}/ -o VertaCut-${{ steps.v.outputs.version }}.zip HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            "VertaCut-${{ steps.v.outputs.version }}.zip" \
            --title "VertaCut ${{ steps.v.outputs.version }}" \
            --notes-file .github/release-notes.md \
            --target "${{ github.sha }}" --latest
